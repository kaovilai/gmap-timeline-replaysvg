name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Install optional dependencies
        run: python3 -m pip install --quiet pillow
      - name: Run worldmap tests
        run: python3 -I -B tests/test_worldmap.py
      - name: Check browser and Python rendering parity
        run: node tests/parity.mjs
      - name: Check the GIF encoder round-trips
        run: node tests/gif.mjs
      - name: Check the PWA manifest and service worker
        run: node tests/pwa.mjs
